name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@727b9ec14b6f3a5aa3e03a3cbac0fefe100a3251  # main
    with:
      terraform-directories: '["terraform"]'
