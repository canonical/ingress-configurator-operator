name: Tests

on:
  pull_request:

jobs:
  unit-tests:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      with-uv: true
      # Temporarily disable check-lib until we publish cache_config.py under content-cache.
      require-check-lib: false
