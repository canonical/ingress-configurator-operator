project: ingress-configurator-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge-juju3.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration-juju3/:
    summary: ingress-configurator charm integration tests (Juju 3)
    working-dir: ./
    discover-path: tests/integration/
    backends:
    - integration-test
    environment:
      CONCIERGE: concierge-juju3.yaml
  tests/integration-juju4/:
    summary: ingress-configurator charm integration tests (Juju 4)
    working-dir: ./
    discover-path: tests/integration/
    backends:
    - integration-test
    environment:
      CONCIERGE: concierge-juju4.yaml
