project: ingress-configurator-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
environment:
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration-lxd-juju4/:
    summary: ingress-configurator LXD integration tests (Juju 4)
    working-dir: ./
    discover-path: tests/integration/lxd/
    backends:
    - integration-test
    environment:
      CONCIERGE: concierge-lxd-juju4.yaml
  tests/integration-k8s-juju4/:
    summary: ingress-configurator Kubernetes integration tests (Juju 4)
    working-dir: ./
    discover-path: tests/integration/k8s/
    backends:
    - integration-test
    environment:
      CONCIERGE: concierge-k8s-juju4.yaml
  tests/integration-k8s-lxd-juju4/:
    summary: ingress-configurator cross-model integration tests (Juju 4)
    working-dir: ./
    discover-path: tests/integration/k8s_lxd/
    backends:
    - integration-test
    environment:
      CONCIERGE: concierge-k8s-lxd-juju4.yaml
